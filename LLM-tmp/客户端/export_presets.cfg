[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/voice/*.json"
exclude_filter="tests/*,content/*,assets/imported/rubbing_master.png"
export_path="../交付/檐下千秋-功能修复版/檐下千秋.exe"

[preset.0.options]
custom_template/debug="../../.tools/godot/templates/windows_debug_x86_64.exe"
